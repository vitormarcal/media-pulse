<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffdf8" />
    <title>Sem conexão · Media Pulse</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fffdf8;
        color: #211922;
        font:
          16px/1.4 -apple-system,
          system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 480px;
        padding: 32px;
        border-radius: 28px;
        background: #fff;
      }
      .brand {
        color: #62625b;
        font-weight: 600;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1.2px;
      }
      p {
        color: #62625b;
      }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 16px;
        background: #e5e5e0;
        color: #211922;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #435ee5;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Media Pulse</p>
      <h1>Sem conexão com o Media Pulse</h1>
      <p>Verifique sua conexão e se o servidor está disponível para acessar o acervo.</p>
      <a href="">Tentar novamente</a>
    </main>
  </body>
</html>
